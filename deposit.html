<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Deposit</title>
    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstraps js -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- CSS propio -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <script defer src="./assets/js/deposit.js"></script>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary bg-primary" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="./index.html">Alky-Wallet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html">Login</a>
                    <a class="nav-link" href="menu.html">Menu</a>
                    <a class="nav-link active" aria-current="page" href="deposit.html">Deposit</a>
                    <a class="nav-link" href="sendmoney.html">Send Money</a>
                    <a class="nav-link" href="transactions.html">Transactions</a>
                </div>
            </div>
        </div>
    </nav>
    <header>
        <h1 class="mt-5 text-center text-primary-emphasis">Depositar</h1>
    </header>
    <main class="container py-4">
        <section class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-4 text-center">
                <p class="mb-0">Dinero en Cuenta:</p>
                <p class="fw-bold fs-1">$<span id="montoBalance"></span></p>
                <form id="formDeposit">
                    <div class="mb-3">
                        <label for="monto" class="form-label">Monto a depositar:</label>
                        <input type="number" class="form-control" name="monto" id="monto" min="500" max="9999999"
                            placeholder="Introduce monto a Despositar" required>
                        <div id="passwordHelpBlock" class="form-text">
                            Monto mínimo de Transferencia: $500.
                        </div>
                    </div>
                    <div>
                        <input type="submit" value="Realizar depósito" class="btn btn-info my-1 col-12 mb-3">
                    </div>
                </form>
                    <div class="mb-3">
                        <a href="./menu.html" class="btn btn-dark my-1 col-12">Volver al Menú Principal</a>
                    </div>
            </div>

        </section>
    </main>
</body>

</html>
